<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辅导员工作站 WorkStation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='16' rx='2' fill='%231b3a5b'/%3E%3Ccircle cx='12' cy='13' r='3.2' fill='%23fff'/%3E%3Cpath d='M8.5 18.5c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#1b3a5b; --navy-2:#16304d; --primary:#2a6fb0; --primary-d:#1f5a92;
  --bg:#f2f5f9; --card:#ffffff; --border:#dfe5ec; --border-s:#e9eef3;
  --text:#23303e; --muted:#64748b; --line:#c9d4e0;
  --green:#2f9e63; --green-bg:#e7f5ec; --amber:#d98a2b; --amber-bg:#fbf0e0;
  --red:#c4503e; --red-bg:#f9e9e5; --teal:#2b8a83; --teal-bg:#e4f2f1; --gray:#7a8698; --gray-bg:#eef1f5;
  --radius:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
a{color:var(--primary)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 10px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;line-height:1.55}
::placeholder{color:#9aa7b5}

/* ===== 布局 ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:232px;background:var(--navy);color:#cddbe9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand .bname{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px}
.brand .bsub{font-size:11px;color:#8fa9c4;margin-top:2px}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;color:#c4d4e5;font-size:14px;cursor:pointer;border-left:3px solid transparent;margin-bottom:2px;transition:background .15s,color .15s}
.nav-item svg{flex-shrink:0;opacity:.9}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#6db3f2}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8fa9c4;line-height:1.7}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#topbar h1{font-size:21px;margin:0;color:var(--navy);font-weight:700}
#topbar .sub{font-size:13px;color:var(--muted);margin-top:2px}
#viewActions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:22px 24px 40px;flex:1}
.view{display:none}
.view.active{display:block}

/* ===== 组件 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:8px 14px;font-size:14px;font-weight:500;transition:background .15s,border-color .15s}
.btn svg{width:15px;height:15px}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d)}
.btn-g{background:#fff;border-color:var(--border);color:var(--text)}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
.btn-d{background:var(--red-bg);color:var(--red)}
.btn-d:hover{background:#f2dcd6}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:5px}
.btn-xs{padding:3px 8px;font-size:12px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px;color:var(--navy);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 svg{width:17px;height:17px;color:var(--primary)}
.section-title{font-size:15px;font-weight:700;color:var(--navy);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat-grid.p4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1200px){.stat-grid{grid-template-columns:repeat(3,1fr)}.stat-grid.p4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr)}.stat-grid.p4{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-card .k{font-size:13px;color:var(--muted)}
.stat-card .v{font-size:26px;font-weight:700;color:var(--navy);margin-top:2px;font-variant-numeric:tabular-nums}
.stat-card .v.warn{color:var(--red)}
.chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.chart-grid{grid-template-columns:1fr}}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;min-width:0}
.chart-box h4{margin:0 0 10px;font-size:14px;color:var(--navy);font-weight:600}
.chart-box .chart{height:210px;width:100%}
.chart-fallback{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.chart-fallback .fb-row{display:flex;align-items:center;gap:10px;font-size:13px}
.chart-fallback .fb-name{width:88px;flex-shrink:0;color:var(--muted)}
.chart-fallback .fb-bar{height:16px;border-radius:3px;background:var(--primary);min-width:2px}
.chart-fallback .fb-num{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.panel-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1000px){.panel-2{grid-template-columns:1fr}}

/* ===== 表格 ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{width:240px}
.toolbar select{max-width:200px}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;background:#f7f9fc;border-bottom:1px solid var(--border);padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border-s);font-size:14px;vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f6f9fc}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.ops button{font-size:12px;padding:3px 8px;border-radius:4px;background:#fff;border:1px solid var(--border);color:var(--muted);cursor:pointer}
.ops button:hover{border-color:var(--primary);color:var(--primary)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:26px;margin-bottom:8px;color:var(--line)}

/* ===== 徽标 / 标签 ===== */
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-g{background:var(--green-bg);color:var(--green)}
.badge-a{background:var(--amber-bg);color:var(--amber)}
.badge-r{background:var(--red-bg);color:var(--red)}
.badge-b{background:#e6eef7;color:var(--primary)}
.badge-gray{background:var(--gray-bg);color:var(--gray)}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;margin:1px 3px 1px 0;white-space:nowrap}
.tag-红{background:var(--red-bg);color:var(--red)}
.tag-橙{background:var(--amber-bg);color:var(--amber)}
.tag-黄{background:#f6efd9;color:#a37f1f}
.tag-其他{background:var(--gray-bg);color:var(--gray)}

/* ===== 表单 ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
.form-item label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.form-item .req{color:var(--red)}
.form-full{grid-column:1/-1}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ===== 弹窗 / 提示 ===== */
.overlay{position:fixed;inset:0;background:rgba(20,32,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:10px;width:100%;max-width:640px;padding:20px 22px;box-shadow:0 10px 40px rgba(20,32,46,.18)}
.modal h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.modal .m-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal textarea{width:100%}
#toastRoot{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#23303e;color:#fff;border-radius:7px;padding:10px 16px;font-size:14px;max-width:340px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:tin .2s ease}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 锁屏 ===== */
#lockScreen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:100}
.lock-card{background:#fff;border-radius:12px;padding:30px 34px;width:340px;text-align:center}
.lock-card h2{margin:0 0 6px;color:var(--navy);font-size:19px}
.lock-card p{color:var(--muted);font-size:13px;margin:0 0 16px}
.lock-card input{width:100%;margin-bottom:12px;text-align:center}
.lock-err{color:var(--red);font-size:13px;min-height:20px;margin-bottom:8px}

/* ===== 时间轴 ===== */
.tl{display:grid;grid-template-columns:112px 28px 1fr}
@media(max-width:640px){.tl{grid-template-columns:86px 24px 1fr}}
.tl .tl-date{text-align:right;padding:9px 8px 9px 0;color:var(--muted);font-size:13px}
.tl .tl-axis{position:relative}
.tl .tl-axis::before{content:'';position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:var(--line)}.tl .tl-axis .dot{position:absolute;left:50%;top:17px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--primary);transform:translate(-50%,-50%);z-index:1}
.tl .tl-axis .dot.r{border-color:var(--red)}
.tl .tl-axis .dot.a{border-color:var(--amber)}
.tl .tl-body{padding:8px 0 16px 12px;min-width:0}
.tl .tl-body .t-topic{font-size:14px;font-weight:600;color:var(--text)}
.tl .tl-body .t-meta{font-size:13px;color:var(--muted);margin:2px 0 4px}
.tl .tl-body .t-content{font-size:13.5px;color:#3d4c5e;background:#f7f9fc;border-radius:6px;padding:8px 10px;white-space:pre-wrap}

/* ===== 画像 ===== */
.portrait-head{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media(max-width:640px){.portrait-head{grid-template-columns:1fr}}
.avatar{width:76px;height:76px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.p-basic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;font-size:14px}
.p-basic .it{color:var(--muted)}
.p-basic .iv{font-weight:600;color:var(--text)}
.warn-card{background:var(--red-bg);border:1px solid #ecc7be;border-radius:var(--radius);padding:12px 16px;font-size:14px;color:#8a3527;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.warn-card svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}

/* ===== 提示横幅 ===== */
.banner{background:linear-gradient(120deg,#eef4fb,#e9f3ee);border:1px solid #cddcea;border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;font-size:14px}
.banner b{color:var(--navy)}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;background:#fafcfe;margin-bottom:14px;transition:border-color .15s,background .15s}
.dropzone.drag{border-color:var(--primary);background:#eef5fc}

/* ===== 窄屏 ===== */
@media(max-width:860px){
  #app{flex-direction:column}
  #sidebar{width:100%;height:auto;position:static}
  .brand{padding:12px 16px}
  .nav{display:flex;overflow-x:auto;padding:6px 8px;gap:4px}
  .nav-item{flex-shrink:0;padding:8px 12px;border-left:none;border-bottom:3px solid transparent}
  .nav-item.active{border-bottom-color:#6db3f2}
  .side-foot{display:none}
  #topbar{padding:12px 16px}
  #content{padding:16px 14px 32px}
  .toolbar input[type=search]{width:100%}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>

<div id="lockScreen" hidden>
  <form class="lock-card" id="lockForm">
    <h2>辅导员工作站</h2>
    <p>此工作站已设置访问密码，请输入后进入</p>
    <input type="password" id="lockPass" placeholder="访问密码" autocomplete="off">
    <div class="lock-err" id="lockErr"></div>
    <button class="btn btn-p" style="width:100%;justify-content:center" type="submit">进入工作站</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6db3f2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><circle cx="12" cy="12.8" r="2.9"/><path d="M9 17.4c.8-1.5 1.9-2.3 3-2.3s2.2.8 3 2.3"/></svg>
      <div><div class="bname">辅导员工作站</div><div class="bsub">WorkStation · 本地版</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div>
        <h1 id="viewTitle">工作台</h1>
        <div class="sub" id="viewSub">今日概览与待办</div>
      </div>
      <div id="viewActions"></div>
    </header>
    <div id="content">
      <section id="view-home" class="view"></section>
      <section id="view-students" class="view"></section>
      <section id="view-talks" class="view"></section>
      <section id="view-portrait" class="view"></section>
      <section id="view-files" class="view"></section>
      <section id="view-settings" class="view"></section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
'use strict';
/* ================= 数据层与工具 ================= */
var LS_KEY = 'ws_db_v1';
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function djb2(str){ var h=5381,i; for(i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return 'h'+h.toString(16); }
function fmtNum(n){ return Number(n||0).toLocaleString('zh-CN'); }

function defDB(){
  return {
    students:[], talks:[], files:[], portraits:[],
    settings:{ passHash:'', talker:'', topicDict:['入学适应','学业指导','心理健康','情感人际','家庭经济','职业规划','纪律安全','党团发展','资助帮扶','其他'], catDict:['谈心谈话','通知文件','活动材料','评奖评优','资助材料','党团材料','安全材料','心理材料','其他'] },
    meta:{ version:1, seedAt:null, lastBackup:null }
  };
}
var DB = defDB();
function loadDB(){ try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var d=JSON.parse(raw); DB=Object.assign(defDB(),d); if(!DB.settings) DB.settings=defDB().settings; } }catch(e){} migrateDB(); }
function migrateDB(){
  if(!Array.isArray(DB.portraits)) DB.portraits=[];
  DB.students.forEach(function(s){
    s.concerns=normConcerns(s.concerns);
    if(s.portraitTags && s.portraitTags.length){
      DB.portraits.push({ sid:s.id, tags:s.portraitTags.slice(), updatedAt:Date.now() });
      delete s.portraitTags;
    }
  });
}
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
  if(wsDir){ scheduleLocalSave(); }
}
function getStudent(id){ for(var i=0;i<DB.students.length;i++){ if(DB.students[i].id===id) return DB.students[i]; } return null; }
function studentName(id){ var s=getStudent(id); return s? s.name : '（未关联）'; }
function talkCountOf(sid){ var n=0,i; for(i=0;i<DB.talks.length;i++){ if(DB.talks[i].sid===sid) n++; } return n; }
function topicDict(){ return DB.settings.topicDict || []; }
function catDict(){ return DB.settings.catDict || []; }
function levelInfo(lv){ if(lv==='r') return ['重点关注','r','badge-r']; if(lv==='a') return ['需关注','a','badge-a']; return ['一般','g','badge-g']; }
var CONCERN_TYPES=['心理','学业','思政','经济'];
var CONCERN_LEVELS=['红','橙','黄'];
function normConcerns(list){
  if(!Array.isArray(list)) return [];
  return list.map(function(c){
    if(c && typeof c==='object' && c.t) return { t:String(c.t), l:(CONCERN_LEVELS.indexOf(c.l)>-1?c.l:'黄') };
    return { t:String(c==null?'':c), l:'黄' };
  }).filter(function(c){ return c.t; });
}
function concernLabel(c){ return (c.t||'')+(c.l?'·'+c.l:''); }
function concernTagClass(c){ var l=c&&c.l; if(l==='红') return 'tag-红'; if(l==='橙') return 'tag-橙'; return 'tag-黄'; }
function concernHas(s,t){ return (s.concerns||[]).some(function(c){ return c.t===t; }); }
function concernsToStr(list){ return normConcerns(list).map(function(c){ return c.t+':'+c.l; }).join(';'); }
function concernsFromStr(str){
  var out=[];
  if(!str) return out;
  String(str).split(/[;；,，、\n]/).forEach(function(seg){
    seg=String(seg).trim(); if(!seg) return;
    var m=seg.match(/^(心理|学业|思政|经济|家庭|其他)\s*[:：\-—]?\s*(红|橙|黄)?/);
    if(m) out.push({ t:m[1], l:(m[2]||'黄') });
  });
  return out;
}
function ymd(dateStr){ if(!dateStr) return '—'; var p=String(dateStr).split('-'); if(p.length<3) return dateStr; return p[0]+'-'+p[1]+'-'+p[2]; }
function monthOf(dateStr){ return String(dateStr||'').slice(0,7); }

/* ================= 通用交互 ================= */
function toast(msg, kind){ var t=document.createElement('div'); t.className='toast '+(kind||'ok'); t.textContent=msg; document.getElementById('toastRoot').appendChild(t); setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },350); },2600); }
function confirmDlg(msg){ return window.confirm(msg); }
function openModal(html){ var r=document.getElementById('modalRoot'); r.innerHTML='<div class="overlay"><div class="modal">'+html+'</div></div>'; var ov=r.firstChild; ov.addEventListener('click',function(e){ if(e.target===ov) closeModal(); }); }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openFilePicker(cb, accept){ var inp=document.createElement('input'); inp.type='file'; if(accept) inp.accept=accept; inp.style.display='none'; document.body.appendChild(inp); inp.addEventListener('change',function(){ if(inp.files&&inp.files[0]) cb(inp.files[0]); document.body.removeChild(inp); }); inp.click(); }
function download(name, content, type){ var blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); document.body.removeChild(a); },500); }

/* 分隔符文本解析（CSV / TSV 通用） */
function parseDelimited(text, delim){
  var rows=[], row=[], cell='', inQ=false, i, c;
  for(i=0;i<text.length;i++){
    c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; } else cell+=c; }
    else if(c==='"'){ inQ=true; }
    else if(c===delim){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c==='\r'){ /* skip */ }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x||'').trim()!==''; }); });
}
function guessDelim(text){ var first=text.split(/\r?\n/)[0]||''; if(first.indexOf('\t')>-1 && first.indexOf(',')===-1) return '\t'; return ','; }
function decodeText(buf){
  var bytes=new Uint8Array(buf);
  try{ var u=new TextDecoder('utf-8',{fatal:true}).decode(bytes); return u; }catch(e){}
  try{ return new TextDecoder('gbk').decode(bytes); }catch(e){}
  return new TextDecoder('utf-8').decode(bytes);
}

function fmtTime(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }
function idbGet(key){
  return new Promise(function(res){
    try{
      var rq=indexedDB.open(IDB_NAME,1);
      rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
      rq.onsuccess=function(){
        var db=rq.result, tx=db.transaction('kv','readonly'), st=tx.objectStore('kv'), g=st.get(key);
        g.onsuccess=function(){ res(g.result||null); };
        g.onerror=function(){ res(null); };
      };
      rq.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbSet(key,val){
  return new Promise(function(res){
    try{
      var rq=indexedDB.open(IDB_NAME,1);
      rq.onupgradeneeded=function(){ rq.result.createObjectStore('kv'); };
      rq.onsuccess=function(){
        var db=rq.result, tx=db.transaction('kv','readwrite'), st=tx.objectStore('kv');
        st.put(val,key);
        tx.oncomplete=function(){ res(true); };
        tx.onerror=function(){ res(false); };
      };
      rq.onerror=function(){ res(false); };
    }catch(e){ res(false); }
  });
}
function localFileNames(){ return ['students.csv','talks.json','files.json','portraits.json','settings.json']; }
function studentsToCsv(){
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var head=Object.keys(STUDENT_FIELDS).map(function(k){ return STUDENT_FIELDS[k]; }).concat(['特殊关注','备注']).join(',');
  var lines=[head];
  DB.students.forEach(function(s){
    var vals=Object.keys(STUDENT_FIELDS).map(function(k){ return q(s[k]); });
    vals.push(q(concernsToStr(s.concerns)), q(s.note||''));
    lines.push(vals.join(','));
  });
  return '\uFEFF'+lines.join('\n');
}
function parseStudentsCsv(text){
  var delim=guessDelim(text);
  var rows=parseDelimited(text, delim);
  if(rows.length<2) return [];
  var colMap={}, i;
  rows[0].forEach(function(hd,ix){ var a=headerAlias(hd); if(a) colMap[a]=ix; });
  if(colMap.xh===undefined && colMap.name===undefined) return [];
  var out=[], now=Date.now();
  for(i=1;i<rows.length;i++){
    var r=rows[i], rec={};
    Object.keys(colMap).forEach(function(field){ var ix=colMap[field]; rec[field]=String(r[ix]==null?'':r[ix]).trim(); });
    var xh=rec.xh||'', name=rec.name||'';
    if(!xh && !name) continue;
    out.push({ id:uid(), xh:xh, name:name, gender:rec.gender||'', origin:rec.origin||'', cls:rec.cls||'', dorm:rec.dorm||'', nation:rec.nation||'', zzmm:rec.zzmm||'', address:rec.address||'', qq:rec.qq||'', phone:rec.phone||'', fName:rec.fName||'', fPhone:rec.fPhone||'', fWork:rec.fWork||'', fPost:rec.fPost||'', fZzmm:rec.fZzmm||'', mName:rec.mName||'', mPhone:rec.mPhone||'', mWork:rec.mWork||'', mPost:rec.mPost||'', mZzmm:rec.mZzmm||'', major:rec.major||'', family:rec.family||'', concerns:concernsFromStr(rec.concerns), note:rec.note||'', createdAt:now, updatedAt:now });
  }
  return out;
}
function scheduleLocalSave(){
  if(wsSaving){ wsSavePending=true; return; }
  saveLocalAll();
}
async function saveLocalAll(){
  if(!wsDir || wsSaving) return;
  wsSaving=true;
  try{
    var payload = {
      'students.csv': studentsToCsv(),
      'talks.json': DB.talks,
      'files.json': DB.files,
      'portraits.json': DB.portraits,
      'settings.json': { settings: DB.settings, meta: DB.meta }
    };
    var names=localFileNames(), i;
    for(i=0;i<names.length;i++){
      var fh=await wsDir.getFileHandle(names[i], {create:true});
      var w=await fh.createWritable();
      await w.write(payload[names[i]]);
      await w.close();
    }
    wsLastSaved=new Date();
    updateLocalStatus();
    if(wsSavePending){ wsSavePending=false; wsSaving=false; scheduleLocalSave(); return; }
  }catch(e){
    toast('本地自动保存失败：'+e.message+'（数据仍保留在浏览器本地存储中）','err');
  }
  wsSaving=false;
}
async function loadLocalAll(dir){
  var names=localFileNames(), i;
  for(i=0;i<names.length;i++){
    var nm=names[i];
    try{
      var fh=await dir.getFileHandle(nm);
      var f=await fh.getFile();
      if(nm==='students.csv'){
        var txt=await f.text();
        if(txt.charAt(0)==='\uFEFF') txt=txt.slice(1);
        DB.students=parseStudentsCsv(txt);
      } else {
        var d=JSON.parse(await f.text());
        if(nm==='talks.json' && Array.isArray(d)) DB.talks=d;
        else if(nm==='files.json' && Array.isArray(d)) DB.files=d;
        else if(nm==='portraits.json' && Array.isArray(d)) DB.portraits=d;
        else if(nm==='settings.json' && d && d.settings){ DB.settings=Object.assign(defDB().settings, d.settings); if(d.meta) DB.meta=Object.assign({}, DB.meta, d.meta); }
      }
    }catch(e){
      if(nm==='students.csv'){
        try{
          var fh2=await dir.getFileHandle('students.json');
          var f2=await fh2.getFile();
          var d2=JSON.parse(await f2.text());
          if(Array.isArray(d2) && d2.length) DB.students=d2;
        }catch(e2){}
      }
    }
  }
  migrateDB();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
}
async function chooseDataDir(){
  if(!supportsDirApi()){ toast('当前浏览器不支持本地文件夹访问，请使用 Chrome 或 Edge 浏览器打开本页面','err'); return; }
  try{
    var dir=await window.showDirectoryPicker({ mode:'readwrite' });
    var perm=await dir.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await dir.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ toast('未获得文件夹读写权限','err'); return; }
    wsDir=dir;
    await idbSet(IDB_KEY, dir);
    var names=localFileNames(), empty=true, i;
    for(i=0;i<names.length;i++){ try{ await dir.getFileHandle(names[i]); empty=false; break; }catch(e){} }
    if(empty){
      await saveLocalAll();
      toast('已连接数据文件夹，现有数据已按模块保存到本地');
    } else {
      await loadLocalAll(dir);
      toast('已连接数据文件夹并加载本地数据');
    }
    updateLocalStatus();
    if(curView) go(curView);
  }catch(e){
    if(e && e.name!=='AbortError') toast('无法连接数据文件夹：'+e.message,'err');
  }
}
async function refreshFromLocal(){
  if(!wsDir){ toast('尚未选择数据文件夹','err'); return; }
  await loadLocalAll(wsDir);
  if(curView) go(curView);
  updateLocalStatus();
  toast('已从本地数据文件重新读取');
}
async function restoreLocalDir(){
  if(!supportsDirApi()) return;
  var h=await idbGet(IDB_KEY);
  if(!h) return;
  try{
    var perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await h.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      wsDir=h;
      await loadLocalAll(h);
      updateLocalStatus();
      if(curView) go(curView);
    }
  }catch(e){ wsDir=null; }
}
function updateLocalStatus(){
  var foot=document.getElementById('sideFoot');
  if(!foot) return;
  var name=wsDirName();
  if(name){
    foot.innerHTML='数据文件夹：<b>'+esc(name)+'</b><br>'+(wsLastSaved?('最近保存 '+fmtTime(wsLastSaved)+'<br>'):'')+'每次修改后自动保存至本地';

    foot.innerHTML='当前使用浏览器本地存储<br>建议在“设置”中选择数据文件夹，<br>启用按模块的本地自动保存';
  } else {
    foot.innerHTML='数据保存在本机浏览器中<br>本地自动保存需 Chrome / Edge 浏览器';
  }
}

function chartBoxHtml(id,title){ return '<div class="chart-box"><h4>'+title+'</h4><div id="'+id+'" class="chart"></div></div>'; }
function fbBars(rows){
  var max=1, i;
  for(i=0;i<rows.length;i++){ if(rows[i][1]>max) max=rows[i][1]; }
  var h='<div class="chart-fallback">';
  rows.forEach(function(r){
    var w=Math.max(3, Math.round(r[1]/max*100));
    h+='<div class="fb-row"><span class="fb-name">'+esc(r[0])+'</span><div class="fb-bar" style="width:'+w+'%"></div><span class="fb-num">'+r[1]+'</span></div>';
  });
  h+='</div>';
  return h;
}
function drawCharts(){
  var st=DB.students, tk=DB.talks, i;
  function counts(arr,key){ var o={}; arr.forEach(function(x){ var k=x[key]||'未分类'; o[k]=(o[k]||0)+1; }); return Object.keys(o).map(function(k){ return [k,o[k]]; }).sort(function(a,b){ return b[1]-a[1]; }); }
  var zz=counts(st,'zzmm');
  var lv=counts(tk,'level').map(function(r){ var n={g:'一般',a:'需关注',r:'重点关注'}[r[0]]||r[0]; return [n,r[1]]; });
  var tp=counts(tk,'topic').slice(0,6);
  if(!HAS_ECHARTS){
    var z=document.getElementById('chartZzmm'); if(z) z.innerHTML=fbBars(zz.length?zz:[['暂无数据',0]]);
    var l=document.getElementById('chartLevel'); if(l) l.innerHTML=fbBars(lv.length?lv:[['暂无数据',0]]);
    var t=document.getElementById('chartTopic'); if(t) t.innerHTML=fbBars(tp.length?tp:[['暂无数据',0]]);
    return;
  }
  try{
    function pie(data, colors){
      return { tooltip:{trigger:'item', confine:true},
        legend:{bottom:0, itemWidth:10, itemHeight:10, textStyle:{fontSize:12,color:'#64748b'}},
        series:[{type:'pie', radius:['42%','68%'], center:['50%','44%'], data:data,
          label:{show:true, formatter:'{b} {c}', fontSize:11, color:'#23303e'},
          itemStyle:{borderColor:'#fff', borderWidth:2},
          color: colors }] };
    }
    function bar(rows){
      return { tooltip:{trigger:'axis', axisPointer:{type:'shadow'}, confine:true},
        grid:{left:6,right:40,top:6,bottom:6,containLabel:true},
        xAxis:{type:'value', axisLine:{show:false}, axisTick:{show:false}, splitLine:{lineStyle:{color:'#eef1f5'}}, axisLabel:{color:'#64748b',fontSize:11}},
        yAxis:{type:'category', inverse:true, data:rows.map(function(r){return r[0];}), axisLine:{show:false}, axisTick:{show:false}, axisLabel:{color:'#23303e',fontSize:12}},
        series:[{type:'bar', data:rows.map(function(r){return r[1];}), barWidth:'55%', itemStyle:{color:'#2a6fb0',borderRadius:[0,3,3,0]}, label:{show:true,position:'right',color:'#64748b',fontSize:11}}] };
    }
    var el,ch;
    el=document.getElementById('chartZzmm'); if(el){ ch=window.echarts.init(el); ch.setOption(pie(zz,['#2a6fb0','#2f9e63','#d98a2b','#7a8698','#2b8a83','#c4503e'])); }
    el=document.getElementById('chartLevel'); if(el){ ch=window.echarts.init(el); ch.setOption(pie(lv,['#2f9e63','#d98a2b','#c4503e'])); }
    el=document.getElementById('chartTopic'); if(el){ ch=window.echarts.init(el); ch.setOption(bar(tp)); }
  }catch(e){}
}

function saveStudent(id){
  var xh=document.getElementById('sXh').value.trim();
  var name=document.getElementById('sName').value.trim();
  if(!xh && !name){ toast('请至少填写姓名或学号','err'); return; }
  if(xh){
    var dup=DB.students.find(function(s){ return s.xh===xh && s.id!==id; });
    if(dup){ toast('学号 '+xh+' 已存在（'+dup.name+'），请核对','err'); return; }
  }
  var concerns=[];
  CONCERN_TYPES.forEach(function(t){
    var sel=document.querySelector('input[name="concern_'+t+'"]:checked');
    if(sel && sel.value) concerns.push({ t:t, l:sel.value });
  });
  var obj = id ? getStudent(id) : { id:uid(), createdAt:Date.now() };
  obj.xh=xh; obj.name=name;
  obj.gender=document.getElementById('sGender').value;
  obj.origin=document.getElementById('sOrigin').value.trim();
  obj.cls=document.getElementById('sCls').value.trim();
  obj.dorm=document.getElementById('sDorm').value.trim();
  obj.nation=document.getElementById('sNation').value.trim();
  obj.zzmm=document.getElementById('sZzmm').value.trim();
  obj.address=document.getElementById('sAddr').value.trim();
  obj.qq=document.getElementById('sQq').value.trim();
  obj.phone=document.getElementById('sPhone').value.trim();
  obj.fName=document.getElementById('sFName').value.trim();
  obj.fPhone=document.getElementById('sFPhone').value.trim();
  obj.fWork=document.getElementById('sFWork').value.trim();
  obj.fPost=document.getElementById('sFPost').value.trim();
  obj.fZzmm=document.getElementById('sFZzmm').value.trim();
  obj.mName=document.getElementById('sMName').value.trim();
  obj.mPhone=document.getElementById('sMPhone').value.trim();
  obj.mWork=document.getElementById('sMWork').value.trim();
  obj.mPost=document.getElementById('sMPost').value.trim();
  obj.mZzmm=document.getElementById('sMZzmm').value.trim();
  obj.concerns=concerns;
  obj.note=document.getElementById('sNote').value.trim();
  obj.updatedAt=Date.now();
  if(!id) DB.students.push(obj);
  saveDB(); closeModal(); renderStudentsTable(); toast(id?'已保存修改':'已新增学生 '+name);
}
function delStudent(id){
  var s=getStudent(id); if(!s) return;
  if(!confirmDlg('确定删除学生 '+s.name+'（'+s.xh+'）吗？\n该生的谈话记录与画像关联不会删除，但将不再关联姓名。')) return;
  DB.students=DB.students.filter(function(x){ return x.id!==id; });
  saveDB(); renderStudentsTable(); toast('已删除学生','ok');
}

    var follow = t.followDate ? (t.done ? '<span class="badge badge-g">已完成</span>' : (t.followDate<=todayISO()? '<span class="badge badge-r">待回访 '+ymd(t.followDate)+'</span>' : '<span class="badge badge-gray">'+ymd(t.followDate)+'</span>')) : '—';
    html+='<tr><td>'+ymd(t.time)+'</td><td>'+stu+'</td><td>'+esc(t.talker||'—')+'</td><td>'+esc(t.place||'—')+'</td><td>'+esc(t.topic||'未分类')+'</td><td><span class="badge '+li[2]+'">'+li[0]+'</span></td>'
      +'<td style="color:var(--muted)">'+esc(String(t.content||'').replace(/\n/g,' ').slice(0,42))+(t.content&&t.content.length>42?'…':'')+'</td>'
      +'<td>'+follow+'</td>'
      +'<td><div class="ops"><button onclick="openTalkForm(\''+t.id+'\')">编辑</button><button onclick="delTalk(\''+t.id+'\')">删除</button></div></td></tr>';
  });
  html+='</tbody></table></div>';
  html+='<div style="font-size:12px;color:var(--muted);margin-top:8px">共 '+list.length+' 条记录（共 '+DB.talks.length+' 条）</div>';
  document.getElementById('talksBox').innerHTML=html;
}
function openTalkForm(id){
  var t = id ? DB.talks.find(function(x){ return x.id===id; }) : null;
  var v = t || { sid:'', time:todayISO(), place:'', topic:'', level:'g', content:'', traits:'', followUp:'', followDate:'', done:false };
  var s = v.sid ? getStudent(v.sid) : null;
  var tip = s ? ('<span style="color:var(--green);font-size:13px">已关联：'+esc(s.name)+' · '+esc(s.xh)+' · '+esc(s.cls||'未填班级')+'</span>') : '';
  var levelSeg='<div class="seg" id="lvSeg">'
    +['g|一般','a|需关注','r|重点关注'].map(function(x){ var p=x.split('|'); return '<button type="button" data-lv="'+p[0]+'" class="'+(v.level===p[0]?'on':'')+'">'+p[1]+'</button>'; }).join('')
    +'</div>';
  openModal('<h2>'+(id?'编辑谈话记录':'新增谈话记录')+'</h2><div class="m-sub">选择学生后会带出班级等信息；谈话内容请如实摘要记录，建议包含关键信息。</div>'
    +'<div class="form-grid">'
    +'<div class="form-item form-full"><label><span class="req">*</span>谈话学生（输入姓名或学号选择）</label>'
      +'<input id="tStu" list="studentList" value="'+esc(s? s.name:'')+'" placeholder="输入姓名或学号"><datalist id="studentList">'
      +DB.students.map(function(x){ return '<option value="'+esc(x.name)+'">'+esc(x.xh)+' · '+esc(x.cls||'')+'</option>'; }).join('')
      +'</datalist><div id="tStuTip" style="margin-top:5px">'+tip+'</div></div>'
    +'<div class="form-item"><label><span class="req">*</span>谈话时间</label><input type="date" id="tTime" value="'+v.time+'"></div>'
    +'<div class="form-item"><label>谈话人</label><input id="tTalker" value="'+esc(v.talker||DB.settings.talker||'')+'"></div>'
    +'<div class="form-item"><label>谈话地点</label><input id="tPlace" value="'+esc(v.place||'')+'" placeholder="如 办公室 / 操场 / 线上"></div>'
    +'<div class="form-item"><label>话题</label><input id="tTopic" list="topicList" value="'+esc(v.topic||'')+'"><datalist id="topicList">'+topicDict().map(function(x){ return '<option>'+esc(x)+'</option>'; }).join('')+'</datalist></div>'
    +'<div class="form-item"><label>关注等级</label>'+levelSeg+'</div>'
    +'<div class="form-item"><label>学生特点</label><input id="tTraits" value="'+esc(v.traits||'')+'" placeholder="如 性格内向、学业压力大"></div>'
    +'<div class="form-item form-full"><label>谈话内容</label><textarea id="tContent" rows="5" placeholder="记录谈话要点、学生反馈、你的引导与建议">'+esc(v.content||'')+'</textarea></div>'
    +'<div class="form-item"><label>后续跟进事项</label><input id="tFollow" value="'+esc(v.followUp||'')+'" placeholder="如 一周后回访"></div>'
    +'<div class="form-item"><label>跟进日期</label><input type="date" id="tFollowDate" value="'+esc(v.followDate||'')+'"></div>'
    +'</div>'
    +'<div class="m-actions"><button class="btn btn-g" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="saveTalk(\''+(id||'')+'\')">保存记录</button></div>');
  document.getElementById('tStu').addEventListener('change', function(){ resolveTalkStudent(); });
  if(v.sid) document.getElementById('tStu').setAttribute('data-sid', v.sid);
  if(v.done){ /* 编辑时不改 done 状态，在列表中标记 */ }
}
function resolveTalkStudent(){
  var val=document.getElementById('tStu').value.trim(); var tip=document.getElementById('tStuTip'); if(!tip) return;
  if(!val){ tip.innerHTML=''; return; }
  var s=null, i;
  for(i=0;i<DB.students.length;i++){ var x=DB.students[i]; if(x.name===val || x.xh===val){ s=x; break; } }
  if(s){ tip.innerHTML='<span style="color:var(--green);font-size:13px">已关联：'+esc(s.name)+' · '+esc(s.xh)+' · '+esc(s.cls||'未填班级')+'</span>'; document.getElementById('tStu').setAttribute('data-sid',s.id); }
  else { tip.innerHTML='<span style="color:var(--red);font-size:13px">未找到匹配学生，请先到学生台账导入或新增</span>'; document.getElementById('tStu').removeAttribute('data-sid'); }
}
function saveTalk(id){
  var sid=document.getElementById('tStu').getAttribute('data-sid');
  var time=document.getElementById('tTime').value;
  if(!sid){ toast('请先选择台账中的学生（输入姓名或学号）','err'); return; }
  if(!time){ toast('请填写谈话时间','err'); return; }
  var level='g';
  document.querySelectorAll('#lvSeg button').forEach(function(b){ if(b.classList.contains('on')) level=b.getAttribute('data-lv'); });
  var obj = id ? DB.talks.find(function(x){ return x.id===id; }) : { id:uid(), createdAt:Date.now() };
  obj.sid=sid; obj.time=time;
  obj.talker=document.getElementById('tTalker').value.trim();
  obj.place=document.getElementById('tPlace').value.trim();
  obj.topic=document.getElementById('tTopic').value.trim()||'未分类';
  obj.level=level;
  obj.traits=document.getElementById('tTraits').value.trim();
  obj.content=document.getElementById('tContent').value.trim();
  obj.followUp=document.getElementById('tFollow').value.trim();
  obj.followDate=document.getElementById('tFollowDate').value;
  if(!obj.done) obj.done=false;
  obj.updatedAt=Date.now();
  var st=getStudent(sid); if(st){ st.updatedAt=Date.now(); }
  if(!id) DB.talks.push(obj);
  saveDB(); closeModal(); renderTalksTable(); toast(id?'已保存修改':'已保存谈话记录');
}
function delTalk(id){
  var t=DB.talks.find(function(x){ return x.id===id; }); if(!t) return;
  if(!confirmDlg('确定删除这条谈话记录吗？')) return;
  DB.talks=DB.talks.filter(function(x){ return x.id!==id; });
  saveDB(); renderTalksTable(); toast('已删除记录','ok');
}
function markFollowDone(id){
  var t=DB.talks.find(function(x){ return x.id===id; }); if(!t) return;
  t.done=true; t.updatedAt=Date.now(); saveDB();
  if(curView==='home') RENDERERS.home(); else renderTalksTable();
  toast('已标记跟进完成');
}
function exportTalks(){
  var lines=[['谈话时间','姓名','学号','班级','谈话人','地点','话题','关注等级','学生特点','谈话内容','跟进事项','跟进日期','已完成'].join(',')];
  DB.talks.forEach(function(t){
    var s=getStudent(t.sid);
    function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
    lines.push([q(t.time),q(s?s.name:''),q(s?s.xh:''),q(s?s.cls:''),q(t.talker),q(t.place),q(t.topic),q({g:'一般',a:'需关注',r:'重点关注'}[t.level]||''),q(t.traits),q(t.content),q(t.followUp),q(t.followDate),q(t.done?'是':'')].join(','));
  });
  download('谈心谈话记录_'+todayISO()+'.csv','\uFEFF'+lines.join('\n'),'text/csv;charset=utf-8');
  toast('已导出谈话记录 CSV');
}

function goPortrait(id){

function renderPortrait(sid){
  var s=getStudent(sid); if(!s) return;
  var talks=DB.talks.filter(function(t){ return t.sid===sid; }).sort(function(a,b){ return (b.time||'')<(a.time||'')?-1:1; });

  var tm=todayISO();
  var warns=[];
  if(talks.length && talks[0].level==='r') warns.push('最近一次谈话被标记为“重点关注”，建议近期持续跟进并留意状态变化。');

    +'<div class="p-basic">'

    +pItem('民族',s.nation)+pItem('政治面貌',s.zzmm)+pItem('通讯地址',s.address)+pItem('QQ',s.qq)
    +pItem('电话',s.phone)+(s.major?pItem('专业',s.major):'')+(s.family?pItem('家庭情况',s.family):'')
    +pItem('备注',s.note)
    +'</div>'
    +'<div style="margin-top:14px">'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:6px">父亲信息</div>'
    +'<div class="p-basic">'+pItem('姓名',s.fName)+pItem('联系方式',s.fPhone)+pItem('工作单位',s.fWork)+pItem('职务',s.fPost)+pItem('政治面貌',s.fZzmm)+'</div>'
    +'<div style="font-size:13px;color:var(--muted);margin:12px 0 6px">母亲信息</div>'
    +'<div class="p-basic">'+pItem('姓名',s.mName)+pItem('联系方式',s.mPhone)+pItem('工作单位',s.mWork)+pItem('职务',s.mPost)+pItem('政治面貌',s.mZzmm)+'</div>'
    +'</div>'
    +'<div style="margin-top:12px"><span style="font-size:13px;color:var(--muted);margin-right:6px">特殊关注</span>'
    +((s.concerns||[]).length?(s.concerns||[]).map(function(c){ return '<span class="tag '+concernTagClass(c)+'">'+esc(concernLabel(c))+'</span>'; }).join(''):'<span style="color:var(--muted);font-size:13px">未标记</span>')
    +'</div>'
    +'<div style="margin-top:8px"><span style="font-size:13px;color:var(--muted);margin-right:6px">画像标签</span>'

    +' <button class="btn btn-g btn-xs" onclick="addPortraitTag(\''+s.id+'\')">添加标签</button></div>'

    +stat('待回访', fmtNum(talks.filter(function(t){ return t.followDate && t.followDate<=tm && !t.done; }).length), true)
    +stat('关联文件', fmtNum(files.length), false)

  html+='<div class="section-title">成长时间轴（按谈话时间倒序）</div><div class="card">';

      html+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span style="font-weight:600">'+esc(f.name)+'</span><span class="badge badge-gray">'+esc(f.category||'未分类')+'</span><span style="font-size:12px;color:var(--muted)">'+ymd(f.date)+'</span><span style="font-size:12px;color:var(--muted)">'+esc(f.tags&&f.tags.length?f.tags.join('、'):'')+'</span></div>';

function pItem(k,v){ return '<div><span class="it">'+k+'</span><div class="iv">'+esc(v||'—')+'</div></div>'; }
function portraitTagsOf(sid){ var p=DB.portraits.find(function(x){ return x.sid===sid; }); return p? p.tags : []; }
function addPortraitTag(sid){
  var s=getStudent(sid); if(!s) return;
  openModal('<h2>添加画像标签</h2><div class="m-sub">给 '+esc(s.name)+' 补充一个画像标签，如“文体特长”“宿舍骨干”。</div>'
    +'<input id="ptTag" placeholder="输入标签内容" style="width:100%">'
    +'<div class="m-actions"><button class="btn btn-g" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="savePortraitTag(\''+sid+'\')">添加</button></div>');

}
function savePortraitTag(sid){
  var v=document.getElementById('ptTag').value.trim(); if(!v){ toast('标签不能为空','err'); return; }
  var p=DB.portraits.find(function(x){ return x.sid===sid; });
  if(!p){ p={ sid:sid, tags:[], updatedAt:Date.now() }; DB.portraits.push(p); }
  if(p.tags.indexOf(v)>-1){ toast('该标签已存在','err'); return; }
  p.tags.push(v); p.updatedAt=Date.now(); saveDB(); closeModal(); renderPortrait(sid); toast('已添加标签');
}

/* ---------- 文件中心 ---------- */
RENDERERS.files = function(){
  var acts='<button class="btn btn-p" onclick="openFileForm()">注册文件</button>';
  if(window.showDirectoryPicker) acts+='<button class="btn btn-g" onclick="pickFolder()">选择文件夹索引</button>';
  acts+='<button class="btn btn-g" onclick="exportFiles()">导出索引 CSV</button>';
  document.getElementById('viewActions').innerHTML=acts;
  var tags={}; DB.files.forEach(function(f){ (f.tags||[]).forEach(function(t){ if(t) tags[t]=1; }); });
  var tagHtml=Object.keys(tags).sort().map(function(t){ return '<option>'+esc(t)+'</option>'; }).join('');
  var html='<div class="dropzone" id="dropZone"><div style="font-size:15px;color:var(--navy);font-weight:600">拖拽文件到此处注册索引</div><div style="margin-top:4px">仅记录文件名、分类、标签与日期等元数据；文件本体留在你的本地文件夹，不会被移动或上传。</div></div>'
    +'<div class="toolbar">'
    +'<input type="search" placeholder="按文件名查询（不检索内容）" value="'+esc(F.files.q)+'" oninput="filesApply()" id="flQ">'
    +'<select id="flCat" onchange="filesApply()"><option value="">全部分类</option>'+catDict().map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('')+'</select>'
    +'<select id="flTag" onchange="filesApply()"><option value="">全部标签</option>'+tagHtml+'</select>'
    +'</div><div id="filesBox"></div>';
  document.getElementById('view-files').innerHTML=html;
  document.getElementById('flQ').value=F.files.q;
  document.getElementById('flCat').value=F.files.cat;
  document.getElementById('flTag').value=F.files.tag;
  var dz=document.getElementById('dropZone');
  dz.addEventListener('dragover',function(e){ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave',function(){ dz.classList.remove('drag'); });
  dz.addEventListener('drop',function(e){
    e.preventDefault(); dz.classList.remove('drag');
    var fs=e.dataTransfer.files; if(!fs||!fs.length) return;
    var n=0;
    for(var i=0;i<fs.length;i++){
      var f=fs[i]; if(!f.name) continue;
      DB.files.push({ id:uid(), name:f.name, category:'', tags:[], date:todayISO(), size:f.size?f.size+' B':'', note:'', source:'拖拽注册', relPath:'' });
      n++;
    }
    saveDB(); renderFilesTable(); toast('已注册 '+n+' 个文件索引（文件本体未移动）');
  });
  renderFilesTable();
};
function filesApply(){
  F.files.q=(document.getElementById('flQ').value||'').trim();
  F.files.cat=document.getElementById('flCat').value;
  F.files.tag=document.getElementById('flTag').value;
  renderFilesTable();
}
function renderFilesTable(){
  var list=DB.files.slice(), q=F.files.q.toLowerCase();
  if(q) list=list.filter(function(f){ return (f.name||'').toLowerCase().indexOf(q)>-1; });
  if(F.files.cat) list=list.filter(function(f){ return f.category===F.files.cat; });
  if(F.files.tag) list=list.filter(function(f){ return (f.tags||[]).indexOf(F.files.tag)>-1; });
  list.sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; });

function saveFile(id){
  var name=document.getElementById('fName').value.trim();
  if(!name){ toast('文件名不能为空','err'); return; }
  var tags=document.getElementById('fTags').value.split(/[,，、]/).map(function(x){ return x.trim(); }).filter(Boolean);
  var obj = id ? DB.files.find(function(x){ return x.id===id; }) : { id:uid(), createdAt:Date.now(), source:'注册' };
  obj.name=name; obj.category=document.getElementById('fCat').value;
  obj.tags=tags; obj.date=document.getElementById('fDate').value; obj.size=document.getElementById('fSize').value.trim();

function exportFiles(){
  var lines=[['文件名','分类','标签','日期','大小','来源','备注/路径'].join(',')];
  DB.files.forEach(function(f){
    function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
    lines.push([q(f.name),q(f.category),q((f.tags||[]).join('、')),q(f.date),q(f.size),q(f.source),q(f.note)].join(','));
  });
  download('文件索引_'+todayISO()+'.csv','\uFEFF'+lines.join('\n'),'text/csv;charset=utf-8');
  toast('已导出文件索引 CSV');
}
function pickFolder(){
  if(!window.showDirectoryPicker) return;
  window.showDirectoryPicker({ mode:'read' }).then(function(dir){
    var added=0, updated=0;
    function walk(dirHandle, rel){
      var it=dirHandle.values(), p=it.next();
      function next(){
        if(p.done) return Promise.resolve();
        var e=p.value; p=it.next();
        if(e.kind==='file'){
          return e.getFile().then(function(fh){
            var rp=rel? rel+'/'+e.name : e.name;
            var ex=DB.files.find(function(x){ return x.source==='文件夹索引' && x.relPath===rp; });
            if(ex){ ex.size=fh.size+' B'; ex.date=fh.lastModified? new Date(fh.lastModified).toISOString().slice(0,10):ex.date; updated++; }
            else { DB.files.push({ id:uid(), name:e.name, category:'', tags:[], date:fh.lastModified? new Date(fh.lastModified).toISOString().slice(0,10):todayISO(), size:fh.size+' B', note:'', source:'文件夹索引', relPath:rp }); added++; }
            return next();
          });
        }
        if(e.kind==='directory') return walk(e, rel? rel+'/'+e.name : e.name).then(next);
        return next();
      }
      return next();
    }
    walk(dir,'').then(function(){
      saveDB(); renderFilesTable();
      toast('文件夹索引完成：新增 '+added+'、更新 '+updated+' 条');
      var box=document.getElementById('filesBox'); if(box) box.insertAdjacentHTML('beforeend','<div style="font-size:12px;color:var(--muted);margin-top:6px">说明：文件夹索引权限在浏览器会话内有效，下次打开时若需刷新，请重新选择文件夹。</div>');
    });
  }).catch(function(e){ if(e && e.name!=='AbortError') toast('无法读取文件夹：'+e.message,'err'); });
}

function importBackup(){
  openFilePicker(function(file){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d || !d.students || !d.talks || !d.files) throw new Error('结构不符');
        DB=Object.assign(defDB(), d);
        migrateDB();
        saveDB(); go('home'); toast('备份已导入：学生 '+DB.students.length+' 人、谈话 '+DB.talks.length+' 条、文件 '+DB.files.length+' 个');
      }catch(e){ toast('备份文件无效：'+e.message,'err'); }
    };
    fr.readAsText(file);
  }, '.json');
}

}

/* ---------- 学生导入 / 导出 ---------- */
function importStudentsModal(){
  openModal('<h2>导入学生信息</h2><div class="m-sub">支持 CSV 文件（含 Excel 另存的 CSV，自动识别 UTF-8 / GBK 编码），或从 Excel 直接复制粘贴。表头请使用下载的模板：学号、姓名、性别、籍贯、班级、宿舍、民族、政治面貌、通讯地址、QQ、电话，及父亲/母亲姓名、联系方式、工作单位、职务、政治面貌，另含“特殊关注”“备注”两列。特殊关注填写格式“类型:级别”，多项用分号分隔，如 心理:红;学业:橙（类型限 心理/学业/思政/经济，级别限 红/橙/黄）。所有信息都允许缺失；学号必须唯一，空行与学号重复的行会跳过并在下方列出明细。</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">'
    +'<button class="btn btn-p" onclick="pickStudentCsv()">选择 CSV 文件</button>'
    +'<button class="btn btn-g" onclick="pasteStudentsModal()">从 Excel 粘贴</button>'
    +'<button class="btn btn-g" onclick="downloadStudentTemplate()">下载导入模板</button>'
    +'</div><div id="importPreview" style="max-height:300px;overflow:auto"></div>'
    +'<div class="m-actions"><button class="btn btn-g" onclick="closeModal()">关闭</button></div>');
}
function pickStudentCsv(){
  openFilePicker(function(file){
    var fr=new FileReader();
    fr.onload=function(){ showStudentImportPreview(decodeText(fr.result)); };
    fr.readAsArrayBuffer(file);
  }, '.csv,.txt');
}
function pasteStudentsModal(){
  openModal('<h2>从 Excel 粘贴导入</h2><div class="m-sub">在 Excel 中选中学生表格区域并复制（Ctrl/Cmd + C），粘贴到下方后点击“解析”。首行必须是表头。</div>'
    +'<textarea id="pasteArea" rows="10" placeholder="在此粘贴 Excel 表格内容…" style="width:100%"></textarea>'
    +'<div id="importPreview" style="max-height:280px;overflow:auto;margin-top:10px"></div>'
    +'<div class="m-actions"><button class="btn btn-g" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="doPaste()">解析并预览</button></div>');
}
function doPaste(){
  var text=document.getElementById('pasteArea').value;
  if(!text.trim()){ toast('粘贴内容为空','err'); return; }
  showStudentImportPreview(text);
}
function showStudentImportPreview(text){
  var box=document.getElementById('importPreview'); if(!box) return;
  var delim=guessDelim(text);
  var rows=parseDelimited(text, delim);
  if(rows.length<2){ box.innerHTML='<div class="empty"><div class="big">—</div>未能解析出有效数据行，请确认首行为表头。</div>'; return; }
  var colMap={}, i;
  rows[0].forEach(function(hd,ix){ var a=headerAlias(hd); if(a) colMap[a]=ix; });
  if(colMap.xh===undefined && colMap.name===undefined){
    box.innerHTML='<div class="empty"><div class="big">—</div>未识别到“学号 / 姓名”表头。请确认首行包含这些字段名（支持 学号/姓名/性别/班级/政治面貌/生源地/宿舍 等）。</div>';
    return;
  }
  var records=[], skips=[], seen={}, exist={};
  DB.students.forEach(function(s){ if(s.xh) exist[s.xh]=s.name; });
  for(i=1;i<rows.length;i++){
    var r=rows[i], rec={};
    Object.keys(colMap).forEach(function(field){ var ix=colMap[field]; rec[field]=String(r[ix]==null?'':r[ix]).trim(); });
    var xh=rec.xh||'', name=rec.name||'';
    if(!xh && !name){ skips.push({ row:i+1, xh:'', name:'', reason:'姓名与学号均为空' }); continue; }
    if(xh && exist[xh]){ skips.push({ row:i+1, xh:xh, name:name, reason:'学号已存在（'+exist[xh]+'）' }); continue; }
    if(xh && seen[xh]){ skips.push({ row:i+1, xh:xh, name:name, reason:'文件内学号重复' }); continue; }
    if(xh) seen[xh]=name;
    records.push(rec);
  }
  window.__pendingImport = records;
  window.__pendingSkips = skips;
  var html='<div style="font-size:14px;margin-bottom:10px">解析完成：可导入 <b style="color:var(--green)">'+records.length+'</b> 条';
  if(skips.length) html+='，跳过 <b style="color:var(--red)">'+skips.length+'</b> 条';
  html+='</div>';
  if(records.length){
    html+='<table style="table-layout:fixed;width:100%;font-size:13px"><colgroup><col style="width:22%"><col style="width:16%"><col style="width:12%"><col style="width:18%"><col style="width:14%"><col style="width:18%"></colgroup><thead><tr style="background:#f7f9fc"><th style="padding:6px 8px;text-align:left">学号</th><th>姓名</th><th>性别</th><th>班级</th><th>政治面貌</th><th>籍贯</th></tr></thead><tbody>';
    records.slice(0,8).forEach(function(rec){
      html+='<tr><td style="padding:5px 8px;border-bottom:1px solid #eef1f5">'+esc(rec.xh)+'</td><td>'+esc(rec.name)+'</td><td>'+esc(rec.gender||'')+'</td><td>'+esc(rec.cls||'')+'</td><td>'+esc(rec.zzmm||'')+'</td><td>'+esc(rec.origin||'')+'</td></tr>';
    });
    if(records.length>8) html+='<tr><td colspan="6" style="padding:6px 8px;color:var(--muted)">… 其余 '+ (records.length-8) +' 条略</td></tr>';
    html+='</tbody></table>';
    html+='<div class="m-actions" style="margin-top:12px"><button class="btn btn-g" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="confirmStudentImport()">确认导入 '+records.length+' 条</button></div>';
  } else {
    html+='<div class="empty"><div class="big">—</div>没有可导入的新学生（可能全部学号重复或为空）。</div>';
  }
  if(skips.length){
    html+='<div style="font-size:13px;margin-top:14px;color:var(--muted)"><b style="color:var(--red)">跳过明细（导入失败项，请核对后修改重导）：</b></div>'
      +'<table style="table-layout:fixed;width:100%;font-size:12.5px"><colgroup><col style="width:15%"><col style="width:26%"><col style="width:23%"><col style="width:36%"></colgroup><thead><tr style="background:#fdf3f3;color:var(--red)"><th style="padding:5px 8px;text-align:left">文件行号</th><th>学号</th><th>姓名</th><th>跳过原因</th></tr></thead><tbody>';
    skips.slice(0,10).forEach(function(k){
      html+='<tr><td style="padding:4px 8px;border-bottom:1px solid #f3e8e8">第 '+k.row+' 行</td><td>'+esc(k.xh||'—')+'</td><td>'+esc(k.name||'—')+'</td><td>'+esc(k.reason)+'</td></tr>';
    });
    if(skips.length>10) html+='<tr><td colspan="4" style="padding:4px 8px;color:var(--muted)">… 其余 '+ (skips.length-10) +' 条略</td></tr>';
    html+='</tbody></table>';
  }
  box.innerHTML=html;
}
function confirmStudentImport(){
  var list=window.__pendingImport||[];
  var skips=window.__pendingSkips||[];
  if(!list.length){ window.__pendingImport=null; window.__pendingSkips=null; closeModal(); return; }
  var now=Date.now();
  list.forEach(function(rec){
    DB.students.push({
      id:uid(), xh:rec.xh||'', name:rec.name||'', gender:rec.gender||'', origin:rec.origin||'', cls:rec.cls||'',
      dorm:rec.dorm||'', nation:rec.nation||'', zzmm:rec.zzmm||'', address:rec.address||'', qq:rec.qq||'', phone:rec.phone||'',
      fName:rec.fName||'', fPhone:rec.fPhone||'', fWork:rec.fWork||'', fPost:rec.fPost||'', fZzmm:rec.fZzmm||'',
      mName:rec.mName||'', mPhone:rec.mPhone||'', mWork:rec.mWork||'', mPost:rec.mPost||'', mZzmm:rec.mZzmm||'',
      major:rec.major||'', family:rec.family||'',
      concerns:concernsFromStr(rec.concerns), note:rec.note||'', createdAt:now, updatedAt:now
    });
  });
  window.__pendingImport=null;
  window.__pendingSkips=null;
  saveDB(); closeModal(); renderStudentsTable();
  var msg='已导入 '+list.length+' 名学生';
  if(skips.length) msg+='，跳过 '+skips.length+' 条（学号重复或空行，已在预览明细中列出）';
  toast(msg);
}
function downloadStudentTemplate(){
  var head=Object.keys(STUDENT_FIELDS).map(function(k){ return STUDENT_FIELDS[k]; }).concat(['特殊关注','备注']).join(',');
  var sample='202600001,张三,男,山东济南,生科2601,3号楼101,汉族,共青团员,山东省济南市历城区山大南路27号,12345678,13800000000,张建国,13900000001,济南市历城区XX街道,科员,中共党员,李秀兰,13900000002,济南市XX中学,教师,群众,心理:黄;学业:橙,';
  download('学生导入模板.csv','\uFEFF'+head+'\n'+sample+'\n','text/csv;charset=utf-8');
  toast('模板已下载（含一行示例，可删除）');
}
function exportStudents(){
  var head=Object.keys(STUDENT_FIELDS).map(function(k){ return STUDENT_FIELDS[k]; }).concat(['特殊关注','备注']).join(',');
  var lines=[head];
  DB.students.forEach(function(s){
    function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
    var vals=Object.keys(STUDENT_FIELDS).map(function(k){ return q(s[k]); });
    vals.push(q(concernsToStr(s.concerns)), q(s.note||''));
    lines.push(vals.join(','));
  });
  download('学生台账_'+todayISO()+'.csv','\uFEFF'+lines.join('\n'),'text/csv;charset=utf-8');
  toast('已导出学生台账 CSV');
}

    document.getElementById('lockScreen').hidden=true;
    document.getElementById('app').hidden=false;
    go('home');

}
